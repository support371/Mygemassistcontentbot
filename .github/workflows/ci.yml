name: Validate

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate serverless functions
        run: npm test
      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Detect committed Telegram bot tokens
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' .; then
            echo 'Potential Telegram bot token detected in the repository.'
            exit 1
          fi

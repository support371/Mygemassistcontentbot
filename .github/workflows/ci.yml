name: Validate

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Show toolchain versions
        run: |
          node --version
          npm --version
      - name: Validate serverless functions
        run: npm test
      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Detect committed Telegram bot tokens
        shell: bash
        run: |
          set -euo pipefail
          matches_file="$(mktemp)"
          if git grep -lI -E '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' -- . >"$matches_file"; then
            echo 'Potential Telegram bot token detected in tracked repository files:'
            sed 's/^/- /' "$matches_file"
            exit 1
          fi
